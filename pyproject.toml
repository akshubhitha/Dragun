[project]
name = "dragun"
version = "0.1.0"
description = "Dragun Phase 1 consumption intelligence agent built with Google Cloud ADK, Gemini Flash, and Firestore."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix-otel>=0.6.0",
    "fastapi>=0.115.0",
    "google-adk>=1.30.0",
    "google-cloud-firestore>=2.19.0",
    "google-genai>=1.0.0",
    "openinference-instrumentation-google-genai>=0.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dragun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
